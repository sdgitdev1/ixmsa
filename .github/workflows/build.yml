name: Build

on:
  workflow_dispatch:

env:
  PYTORCH_ROCM_ARCH: "gfx1201"
  GPU_ARCHS: "gfx1201"
  SAGEATTN_LOCAL_VERSION: "IxMxAMARrocm10.1torch2.14.0gfx1201"
  CC: "clang-cl"
  CXX: "clang-cl"
  CXXFLAGS: "-std=c++20"
  CFLAGS: "-std=c++20"
  DISTUTILS_USE_SDK: "1"

jobs:
  build-wheel:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Enable long paths in Git
        run: git config --system core.longpaths true

      - name: Checkout SageAttention
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install PyTorch, ROCm SDK, and Build dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools packaging build
          python -m pip install torch[device-gfx1201]==2.14.0+rocm10.1.0 torchvision[device-gfx1201]==0.29.0a0+rocm10.1.0 torchaudio==2.11.0.3+rocm10.1.0 rocm[devel,device-gfx1201]==10.1.0 --index-url https://stable.repo.amd.com/rocm/whl-next/
          rocm-sdk init

      - name: Setup ROCm Dynamic Paths
        run: |
          $ROCM_ROOT = (rocm-sdk path --root).Trim()
          $ROCM_BIN = (rocm-sdk path --bin).Trim()
          echo "ROCM_HOME=$ROCM_ROOT" >> $env:GITHUB_ENV
          echo "$ROCM_ROOT\lib\llvm\bin" >> $env:GITHUB_PATH
          echo "$ROCM_BIN" >> $env:GITHUB_PATH
          echo "MAX_JOBS=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV

      - name: Append Local Version Identifier to setup.py, Patch setup.py for C++20 and Local Version
        run: |
          $setup_py = Get-Content setup.py -Raw
          $setup_py = $setup_py -replace 'c\+\+17', 'c++20'
          $setup_py = $setup_py -replace 'std:c\+\+17', 'std:c++20'
          $setup_py = $setup_py -replace "(?m)^(\s*version\s*=\s*['""])([^'""]+)(['""].*)", "`$1`$2+$env:SAGEATTN_LOCAL_VERSION`$3"
          Set-Content -Path setup.py -Value $setup_py
          Write-Host "Updated setup.py version line:"
          Select-String -Path setup.py -Pattern "version="

      - name: Build SageAttention Wheel
        run: |
          python -m pip wheel --no-build-isolation --no-deps -v . --wheel-dir=dist/

      - name: Generate SHA256 Hash File
        run: |
          $whl_files = Get-ChildItem -Path dist -Filter "*.whl"

          if (-not $whl_files) {
            throw "No wheel files found in dist/"
          }

          $hash_lines = foreach ($file in $whl_files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }

          $hash_lines | Out-File -FilePath dist/hash256.txt -Encoding ascii

          Write-Host "Generated SHA256 hashes:"
          Get-Content dist/hash256.txt

      - name: Format Python Version for Artifact Name
        run: |
          $py_ver = "${{ matrix.python-version }}"
          $cp_ver = "cp" + $py_ver.Replace(".", "")
          echo "CP_VER=$cp_ver" >> $env:GITHUB_ENV

      - name: Upload Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sageattention-${{ env.SAGEATTN_LOCAL_VERSION }}-${{ env.CP_VER }}-win_amd64
          path: dist/*
